<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المدخرات - Ed5ar</title>
    <!-- Tailwind CSS للتصميم السريع والجميل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- رأس الصفحة -->
        <header class="bg-white shadow-md rounded-2xl p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">حوسبة المدخرات (Ed5ar)</h1>
                <p class="text-sm text-gray-500">متابعة وحفظ المدخرات السحابية المحدثة فوراً</p>
            </div>
            <div id="connection-status" class="bg-yellow-100 text-yellow-800 text-xs px-3 py-1 rounded-full font-semibold">
                جاري الاتصال بقاعدة البيانات...
            </div>
        </header>

        <!-- لوحة الملخص -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500 mb-1">إجمالي المدخرات</p>
                <h2 id="total-savings" class="text-3xl font-bold text-green-600">0.00 ر.س</h2>
            </div>
        </div>

        <!-- إضافة مبلغ جديد -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4">إضافة مدخرات جديدة</h2>
            <form id="saving-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">المبلغ (ر.س)</label>
                    <input type="number" id="amount" step="0.01" required class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">السبب / الوصف</label>
                    <input type="text" id="note" required placeholder="مثال: توفير شهري" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-xl transition">
                        حفظ في السحابة ☁️
                    </button>
                </div>
            </form>
        </div>

        <!-- جدول الحركات السحابية -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-800">سجل المدخرات</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm">
                            <th class="p-4">المبلغ</th>
                            <th class="p-4">الوصف</th>
                            <th class="p-4">التاريخ</th>
                            <th class="p-4">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="savings-table-body" class="divide-y divide-gray-100 text-gray-700 text-sm">
                        <!-- تضاف البيانات ديناميكياً هنا -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك
        const firebaseConfig = {
          apiKey: "AIzaSyAcSBoqPSwOADYTRN6a_CUkHbxzaC0VxBs",
          authDomain: "ed5ar-d1629.firebaseapp.com",
          projectId: "ed5ar-d1629",
          storageBucket: "ed5ar-d1629.firebasestorage.app",
          messagingSenderId: "420069898432",
          appId: "1:420069898432:web:2704f6ef14bb1a0c11d525",
          measurementId: "G-E2X1LJWR0Z"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusBadge = document.getElementById("connection-status");
        statusBadge.textContent = "متصل بالسحابة ✅";
        statusBadge.className = "bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full font-semibold";

        const form = document.getElementById("saving-form");
        const tableBody = document.getElementById("savings-table-body");
        const totalSavingsEl = document.getElementById("total-savings");

        // إضافة مدخرات جديدة لقاعدة البيانات
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const amount = parseFloat(document.getElementById("amount").value);
            const note = document.getElementById("note").value;

            try {
                await addDoc(collection(db, "savings"), {
                    amount: amount,
                    note: note,
                    date: new Date().toLocaleDateString('ar-SA')
                });
                form.reset();
            } catch (error) {
                console.error("خطأ أثناء الحفظ: ", error);
                alert("حدث خطأ أثناء حفظ البيانات!");
            }
        });

        // جلب البيانات ومزامنتها لحظياً من Firestore
        const q = query(collection(db, "savings"));
        onSnapshot(q, (snapshot) => {
            let total = 0;
            tableBody.innerHTML = "";
            
            if(snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-400">لا توجد مدخرات مسجلة حتى الآن. ابدأ بإضافة مبلغ!</td></tr>`;
                totalSavingsEl.textContent = "0.00 ر.س";
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                total += Number(data.amount) || 0;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="p-4 font-bold text-green-600">${data.amount} ر.س</td>
                    <td class="p-4">${data.note}</td>
                    <td class="p-4 text-gray-500">${data.date || '-'}</td>
                    <td class="p-4">
                        <button onclick="deleteItem('${docSnap.id}')" class="text-red-500 hover:text-red-700 text-xs bg-red-50 hover:bg-red-100 px-3 py-1 rounded-lg transition">حذف</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            totalSavingsEl.textContent = total.toLocaleString('ar-SA') + " ر.س";
        });

        // دالة الحذف المتاحة عامة
        window.deleteItem = async function(id) {
            if(confirm("هل أنت متأكد من حذف هذا السجل؟")) {
                try {
                    await deleteDoc(doc(db, "savings", id));
                } catch (error) {
                    console.error("خطأ أثناء الحذف: ", error);
                }
            }
        };
    </script>
</body>
</html>
