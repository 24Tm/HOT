<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الادخار والاستثمار الذكية</title>
    <style>
        :root {
            --primary: #059669;
            --primary-light: #10b981;
            --primary-bg: #ecfdf5;
            --accent: #3b82f6;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* رأس الصفحة */
        header {
            background: var(--card-bg);
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .date-badge {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* البطاقات العامة */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* شبكة الملخص المالي */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }

        .metric-card {
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-card.saved { background: var(--primary-bg); border: 1px solid #a7f3d0; color: #065f46; }
        .metric-card.target { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
        .metric-card.remaining { background: var(--danger-bg); border: 1px solid #fecaca; color: #991b1b; }

        .metric-title { font-size: 0.85rem; font-weight: 600; opacity: 0.9; }
        .metric-value { font-size: 1.25rem; font-weight: 800; direction: ltr; text-align: right; }
        
        .metric-value input {
            font-size: 1.25rem;
            font-weight: 800;
            border: none;
            background: transparent;
            text-align: right;
            width: 100%;
            color: inherit;
            outline: none;
            border-bottom: 1px dashed currentColor;
        }

        /* شريط التقدم */
        .progress-section {
            margin-top: 10px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-track {
            background: var(--bg-main);
            height: 12px;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--accent), var(--primary-light));
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* نموذج إضافة إيداع جديد */
        .deposit-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .deposit-form {
                grid-template-columns: 1fr;
            }
        }

        .form-control {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: var(--bg-main);
            color: var(--text-main);
        }

        .form-control:focus {
            border-color: var(--accent);
            background: white;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #047857; }
        
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-outline:hover { background: var(--border); color: var(--text-main); }

        .btn-danger { background: var(--danger-bg); color: var(--danger); }
        .btn-danger:hover { background: #fee2e2; }

        /* سجل المعاملات (Scrollable) */
        .transactions-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: 4px;
        }

        .transactions-list::-webkit-scrollbar { width: 5px; }
        .transactions-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-main);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tx-info { display: flex; flex-direction: column; gap: 2px; }
        .tx-title { font-weight: 700; font-size: 0.95rem; }
        .tx-date { font-size: 0.75rem; color: var(--text-muted); }
        
        .tx-right { display: flex; align-items: center; gap: 15px; }
        .tx-amount { font-weight: 800; color: var(--primary); direction: ltr; }
        
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .delete-btn:hover { opacity: 1; }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* شريط أسفل الأزرار */
        .footer-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- الرأس -->
    <header>
        <h1>لوحة الادخار والهدف المالي</h1>
        <div class="date-badge" id="currentDate"></div>
    </header>

    <!-- الملخص والمؤشرات -->
    <div class="card">
        <div class="metrics-grid">
            <div class="metric-card saved">
                <span class="metric-title">المبلغ المتوفر</span>
                <span class="metric-value" id="totalSavedDisplay">0 ر.س</span>
            </div>
            <div class="metric-card target">
                <span class="metric-title">الهدف الكلي</span>
                <span class="metric-value">
                    <input type="number" id="targetInput" value="500000" onchange="updateTarget()">
                </span>
            </div>
            <div class="metric-card remaining">
                <span class="metric-title">باقي عن الهدف</span>
                <span class="metric-value" id="remainingDisplay">500,000 ر.س</span>
            </div>
        </div>

        <!-- شريط التقدم المئوي -->
        <div class="progress-section">
            <div class="progress-info">
                <span>نسبة الإنجاز نحو الهدف</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <!-- إضافة ادخار جديد مخصص -->
    <div class="card">
        <div class="card-title">إضافة مبلغ ادخار أو دفعة جديدة</div>
        <form class="deposit-form" onsubmit="addTransaction(event)">
            <input type="text" id="txTitleInput" class="form-control" placeholder="وصف الدفعة (مثال: ادخار شهر أكتوبر)" required>
            <input type="number" id="txAmountInput" class="form-control" placeholder="المبلغ (ر.س)" required min="1">
            <button type="submit" class="btn btn-primary">إضافة</button>
        </form>
    </div>

    <!-- سجل المدخرات -->
    <div class="card">
        <div class="card-title">
            <span>سجل المدخرات والدفعات</span>
            <span style="font-size: 0.85rem; color: var(--text-muted);" id="txCountText">0 عمليات</span>
        </div>
        <div class="transactions-list" id="transactionsContainer">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <!-- أزرار التحكم والنسخ الاحتياطي -->
    <div class="footer-actions">
        <button class="btn btn-outline" style="flex:1;" onclick="exportData()">تصدير نسخة احتياطية</button>
        <button class="btn btn-danger" onclick="resetAllData()">إعادة ضبط الكل</button>
    </div>

</div>

<script>
    // الحالة والتخزين المحلي
    let targetGoal = Number(localStorage.getItem('pro_v2_target')) || 500000;
    let transactions = JSON.parse(localStorage.getItem('pro_v2_txs')) || [];

    document.getElementById('targetInput').value = targetGoal;

    // عرض التاريخ
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ar-SA', options);

    function updateTarget() {
        targetGoal = Number(document.getElementById('targetInput').value) || 0;
        localStorage.setItem('pro_v2_target', targetGoal);
        renderApp();
    }

    function addTransaction(e) {
        e.preventDefault();
        const titleInput = document.getElementById('txTitleInput');
        const amountInput = document.getElementById('txAmountInput');

        const newTx = {
            id: Date.now(),
            title: titleInput.value.trim(),
            amount: Number(amountInput.value),
            date: new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' })
        };

        transactions.unshift.call(transactions, newTx);
        saveAndRender();

        titleInput.value = '';
        amountInput.value = '';
    }

    function deleteTransaction(id) {
        transactions = transactions.filter(tx => tx.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('pro_v2_txs', JSON.stringify(transactions));
        renderApp();
    }

    function renderApp() {
        const container = document.getElementById('transactionsContainer');
        container.innerHTML = '';

        let totalSaved = 0;

        if (transactions.length === 0) {
            container.innerHTML = `<div class="empty-state">لا توجد مدخرات مسجلة حتى الآن. ابدأ بإضافة أول دفعة بالأعلى!</div>`;
        } else {
            transactions.forEach(tx => {
                totalSaved += tx.amount;
                const item = document.createElement('div');
                item.className = 'transaction-item';
                item.innerHTML = `
                    <div class="tx-info">
                        <span class="tx-title">${tx.title}</span>
                        <span class="tx-date">${tx.date}</span>
                    </div>
                    <div class="tx-right">
                        <span class="tx-amount">+${tx.amount.toLocaleString()} ر.س</span>
                        <button class="delete-btn" onclick="deleteTransaction(${tx.id})" title="حذف">✕</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        const remaining = Math.max(0, targetGoal - totalSaved);
        const percentage = targetGoal > 0 ? Math.min(100, Math.round((totalSaved / targetGoal) * 100)) : 0;

        // تحديث الواجهة
        document.getElementById('totalSavedDisplay').innerText = totalSaved.toLocaleString() + ' ر.س';
        document.getElementById('remainingDisplay').innerText = remaining.toLocaleString() + ' ر.س';
        document.getElementById('progressText').innerText = percentage + '%';
        document.getElementById('progressFill').style.width = percentage + '%';
        document.getElementById('txCountText').innerText = `${transactions.length} عملية`;
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ target: targetGoal, transactions }));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "savings_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function resetAllData() {
        if (confirm('هل أنت متأكد من مسح جميع البيانات وإعادة التعيين بالكامل؟')) {
            localStorage.clear();
            location.reload();
        }
    }

    // التشغيل الأولي
    renderApp();
</script>

</body>
</html>
