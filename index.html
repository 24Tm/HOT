<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الادخار الشهري السحابي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen pb-16 text-slate-100">

    <div class="max-w-xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- رأس الصفحة -->
        <header class="bg-slate-900 shadow-sm rounded-2xl p-4 sm:p-5 flex justify-between items-center border border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 font-bold border border-emerald-500/20">
                    💎
                </div>
                <div>
                    <h1 class="text-base font-extrabold text-white">الادخار الشهري</h1>
                    <p class="text-xs text-slate-400">إدارة وتتبع المدخرات السحابية</p>
                </div>
            </div>
            <div id="connection-status" class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1.5 rounded-full font-bold border border-emerald-500/20 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                السحابة متصلة
            </div>
        </header>

        <!-- لوحة الملخص والهدف -->
        <div class="bg-slate-900 shadow-sm rounded-3xl p-6 text-center border border-slate-800 relative overflow-hidden">
            <div class="absolute top-0 right-0 bg-emerald-600 text-white text-xs px-4 py-1.5 rounded-bl-xl font-bold">
                الهدف: 500,000 ر.س
            </div>
            
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">إجمالي المدخرات الحالية</p>
            <div class="text-4xl sm:text-5xl font-extrabold text-emerald-400 mb-4 tracking-tight">
                <span id="total-savings">0.00</span> <span class="text-2xl font-bold text-slate-400">ر.س</span>
            </div>
            
            <!-- شريط التقدم للهدف -->
            <div class="w-full bg-slate-800 rounded-full h-3 mb-2.5 overflow-hidden p-0.5">
                <div id="progress-bar" class="bg-emerald-500 h-2 rounded-full transition-all duration-700" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400 font-bold px-1">
                <span id="progress-text">0% من الهدف</span>
                <span id="remaining-text">المتبقي: 500,000 ر.س</span>
            </div>
        </div>

        <!-- زر فتح/إغلاق نموذج إضافة حركة -->
        <button id="toggle-form-btn" onclick="toggleForm()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-2xl text-sm shadow-sm transition flex items-center justify-center gap-2">
            <span>➕</span>
            <span>إضافة حركة جديدة (إيداع / سحب)</span>
        </button>

        <!-- نموذج إضافة أو سحب مبلغ جديد (مطوي افتراضياً) -->
        <div id="form-container" class="bg-slate-900 shadow-sm rounded-2xl p-5 border border-slate-800 hidden transition-all duration-300">
            <div class="flex justify-between items-center mb-3.5">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <span>📝</span> تفاصيل الحركة الجديدة
                </h2>
                <button onclick="toggleForm()" class="text-slate-400 hover:text-white text-xs font-bold px-2 py-1 bg-slate-800 rounded-lg">إخفاء ✕</button>
            </div>
            <form id="saving-form" class="space-y-3.5">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">نوع الحركة</label>
                        <select id="action-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none font-semibold text-slate-200">
                            <option value="deposit">🟢 إيداع (توفير)</option>
                            <option value="withdraw">🔴 سحب من المدخرات</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">المبلغ (ر.س)</label>
                        <input type="number" id="amount" step="0.01" placeholder="مثال: 8000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none font-semibold text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">السبب / الوصف</label>
                        <input type="text" id="note" placeholder="مثال: توفير شهري أو ظرف طارئ" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none text-slate-200">
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl text-sm shadow-sm transition active:scale-[0.99] flex items-center justify-center gap-2">
                    <span>حفظ في السحابة</span>
                    <span>☁️</span>
                </button>
            </form>
        </div>

        <!-- زر فتح/إغلاق سجل الحركات (مطوي افتراضياً) -->
        <button id="toggle-table-btn" onclick="toggleTable()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-2xl text-sm shadow-sm border border-slate-800 transition flex items-center justify-center gap-2">
            <span>📋</span>
            <span id="table-btn-text">إظهار سجل المدخرات والحركات</span>
        </button>

        <!-- جدول الحركات السحابية (مطوي افتراضياً) -->
        <div id="table-container" class="bg-slate-900 shadow-sm rounded-2xl overflow-hidden border border-slate-800 hidden transition-all duration-300">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-sm font-bold text-white">📋 سجل المدخرات والحركات</h2>
                <div class="flex items-center gap-2">
                    <span id="items-count" class="text-xs font-bold text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md">0 حركة</span>
                    <button onclick="toggleTable()" class="text-slate-400 hover:text-white text-xs font-bold px-2 py-1 bg-slate-800 rounded-lg">إخفاء ✕</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-950/50 text-slate-400 text-xs font-bold border-b border-slate-800">
                            <th class="p-3.5">نوع الحركة</th>
                            <th class="p-3.5">المبلغ</th>
                            <th class="p-3.5">الوصف</th>
                            <th class="p-3.5">التاريخ</th>
                            <th class="p-3.5 text-center">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="savings-table-body" class="divide-y divide-slate-800 text-sm text-slate-300">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-500 text-xs">جاري المزامنة مع السحابة... ⏳</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAcSBoqPSwOADYTRN6a_CUkHbxzaC0VxBs",
          authDomain: "ed5ar-d1629.firebaseapp.com",
          projectId: "ed5ar-d1629",
          storageBucket: "ed5ar-d1629.firebasestorage.app",
          messagingSenderId: "420069898432",
          appId: "1:420069898432:web:2704f6ef14bb1a0c11d525",
          measurementId: "G-E2X1LJWR0Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("saving-form");
        const formContainer = document.getElementById("form-container");
        const tableContainer = document.getElementById("table-container");
        const tableBtnText = document.getElementById("table-btn-text");
        const tableBody = document.getElementById("savings-table-body");
        const totalSavingsEl = document.getElementById("total-savings");
        const progressBar = document.getElementById("progress-bar");
        const progressText = document.getElementById("progress-text");
        const remainingText = document.getElementById("remaining-text");
        const submitBtn = document.getElementById("submit-btn");
        const itemsCount = document.getElementById("items-count");

        const TARGET_GOAL = 500000;
        const SECRET_HASH = ["D", "d", "1", "6", "1", "6"];

        window.toggleForm = function() {
            if (formContainer.classList.contains("hidden")) {
                formContainer.classList.remove("hidden");
            } else {
                formContainer.classList.add("hidden");
            }
        };

        window.toggleTable = function() {
            if (tableContainer.classList.contains("hidden")) {
                tableContainer.classList.remove("hidden");
                tableBtnText.textContent = "إخفاء سجل المدخرات والحركات";
            } else {
                tableContainer.classList.add("hidden");
                tableBtnText.textContent = "إظهار سجل المدخرات والحركات";
            }
        };

        function verifyPin() {
            const input = prompt("الرجاء إدخال الرقم السري:");
            if (!input) return false;
            const chars = input.split("");
            if (chars.length !== SECRET_HASH.length) return false;
            return chars.every((val, index) => val === SECRET_HASH[index]);
        }

        function formatMoney(val) {
            return Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!verifyPin()) {
                alert("الرقم السري غير صحيح!");
                return;
            }

            const type = document.getElementById("action-type").value;
            let amount = parseFloat(document.getElementById("amount").value);
            const note = document.getElementById("note").value;

            if (!amount || !note) {
                alert("الرجاء إدخال المبلغ والوصف بدقة!");
                return;
            }

            if (type === "withdraw") {
                amount = -Math.abs(amount);
            } else {
                amount = Math.abs(amount);
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>جاري الحفظ...</span> <span class="animate-spin">⏳</span>`;

            try {
                await addDoc(collection(db, "savings"), {
                    amount: amount,
                    type: type,
                    note: note,
                    createdAt: serverTimestamp(),
                    date: new Date().toLocaleDateString('ar-SA')
                });
                form.reset();
                formContainer.classList.add("hidden");
            } catch (error) {
                console.error("خطأ:", error);
                alert("حدث خطأ أثناء الحفظ!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>حفظ في السحابة</span> <span>☁️</span>`;
            }
        });

        const q = query(collection(db, "savings"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            let total = 0;
            tableBody.innerHTML = "";
            itemsCount.textContent = `${snapshot.size} حركة`;
            
            if(snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500 text-xs">لا توجد مدخرات مسجلة حتى الآن.</td></tr>`;
                totalSavingsEl.textContent = "0.00";
                progressBar.style.width = "0%";
                progressText.textContent = "0% من الهدف";
                remainingText.textContent = `المتبقي: ${formatMoney(TARGET_GOAL)} ر.س`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const numAmount = Number(data.amount) || 0;
                total += numAmount;

                const isWithdraw = data.type === 'withdraw' || numAmount < 0;
                const badgeClass = isWithdraw ? "bg-rose-500/10 text-rose-400 border-rose-500/20" : "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                const badgeText = isWithdraw ? "سحب 🔻" : "إيداع 🟢";
                const amountClass = isWithdraw ? "text-rose-400 font-bold" : "text-emerald-400 font-bold";
                const displayAmount = (isWithdraw ? "- " : "+ ") + formatMoney(Math.abs(numAmount));

                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/50 transition-colors";
                tr.innerHTML = `
                    <td class="p-3.5"><span class="text-xs px-2.5 py-1 rounded-full font-bold border ${badgeClass}">${badgeText}</span></td>
                    <td class="p-3.5 ${amountClass}">${displayAmount} ر.س</td>
                    <td class="p-3.5 text-slate-200 font-medium">${data.note}</td>
                    <td class="p-3.5 text-slate-400 text-xs">${data.date || '-'}</td>
                    <td class="p-3.5 text-center">
                        <button onclick="deleteItem('${docSnap.id}')" class="text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">حذف</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            totalSavingsEl.textContent = formatMoney(total);
            
            let percentage = (total / TARGET_GOAL) * 100;
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;
            
            let remaining = TARGET_GOAL - total;
            if (remaining < 0) remaining = 0;

            progressBar.style.width = percentage.toFixed(1) + "%";
            progressText.textContent = percentage.toFixed(1) + "% من الهدف";
            remainingText.textContent = `المتبقي: ${formatMoney(remaining)} ر.س`;

        }, (error) => {
            console.error("خطأ في الاتصال بقاعدة البيانات:", error);
            tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-rose-400 text-xs">تعذر جلب البيانات من السحابة، يرجى التأكد من الاتصال.</td></tr>`;
        });

        window.deleteItem = async function(id) {
            if (!verifyPin()) {
                alert("الرقم السري غير صحيح!");
                return;
            }

            if(confirm("هل أنت متأكد من الحذف؟")) {
                try {
                    await deleteDoc(doc(db, "savings", id));
                } catch (error) {
                    console.error("خطأ الحذف:", error);
                }
            }
        };
    </script>
</body>
</html>
