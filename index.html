<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الادخار الشهري</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 text-slate-800">

    <div class="max-w-2xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- رأس الصفحة -->
        <header class="bg-white shadow-sm rounded-2xl p-5 flex justify-between items-center border border-slate-200/60">
            <div>
                <h1 class="text-xl font-extrabold text-slate-900">الادخار الشهري</h1>
                <p class="text-xs text-slate-500 mt-0.5">إدارة وتتبع المدخرات</p>
            </div>
            <div id="connection-status" class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1.5 rounded-full font-bold border border-emerald-200">
                متصل بالسحابة ✅
            </div>
        </header>

        <!-- لوحة الملخص والهدف (في المنتصف وبارزة) -->
        <div class="bg-white shadow-md rounded-3xl p-6 text-center border border-slate-200/60 relative overflow-hidden">
            <div class="absolute top-0 right-0 bg-emerald-600 text-white text-xs px-4 py-1.5 rounded-bl-xl font-bold">
                الهدف: 500,000 ر.س
            </div>
            
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">إجمالي المدخرات الحالية</p>
            <div class="text-4xl sm:text-5xl font-extrabold text-emerald-600 mb-4 tracking-tight">
                <span id="total-savings">0.00</span> <span class="text-2xl font-bold text-slate-500">ر.س</span>
            </div>
            
            <!-- شريط التقدم للهدف -->
            <div class="w-full bg-slate-100 rounded-full h-3 mb-2.5 overflow-hidden p-0.5">
                <div id="progress-bar" class="bg-emerald-500 h-2 rounded-full transition-all duration-700" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400 font-bold px-1">
                <span id="progress-text">0% من الهدف</span>
                <span>500,000 ر.س</span>
            </div>
        </div>

        <!-- نموذج إضافة أو سحب مبلغ جديد -->
        <div class="bg-white shadow-sm rounded-2xl p-5 border border-slate-200/60">
            <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">➕ إضافة حركة جديدة (إيداع / سحب)</h2>
            <form id="saving-form" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">نوع الحركة</label>
                        <select id="action-type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none font-semibold">
                            <option value="deposit">إيداع (توفير)</option>
                            <option value="withdraw">سحب من المدخرات</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">المبلغ (ر.س)</label>
                        <input type="number" id="amount" step="0.01" required placeholder="مثال: 8000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none font-semibold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">السبب / الوصف</label>
                        <input type="text" id="note" required placeholder="مثال: توفير شهري أو ظرف طارئ" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-sm transition active:scale-[0.99]">
                    حفظ في السحابة ☁️
                </button>
            </form>
        </div>

        <!-- جدول الحركات السحابية -->
        <div class="bg-white shadow-sm rounded-2xl overflow-hidden border border-slate-200/60">
            <div class="p-4 border-b border-slate-100">
                <h2 class="text-sm font-bold text-slate-800">📋 سجل المدخرات والحركات</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-xs font-bold">
                            <th class="p-3.5">نوع الحركة</th>
                            <th class="p-3.5">المبلغ</th>
                            <th class="p-3.5">الوصف</th>
                            <th class="p-3.5">التاريخ</th>
                            <th class="p-3.5 text-center">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="savings-table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                        <!-- تضاف البيانات ديناميكياً هنا مع مؤشر التحميل -->
                        <tr>
                            <td colspan="5" class="p-6 text-center text-slate-400 text-xs">جاري الاتصال وجلب البيانات من القاعدة... ⏳</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAcSBoqPSwOADYTRN6a_CUkHbxzaC0VxBs",
          authDomain: "ed5ar-d1629.firebaseapp.com",
          projectId: "ed5ar-d1629",
          storageBucket: "ed5ar-d1629.firebasestorage.app",
          messagingSenderId: "420069898432",
          appId: "1:420069898432:web:2704f6ef14bb1a0c11d525",
          measurementId: "G-E2X1LJWR0Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById("saving-form");
        const tableBody = document.getElementById("savings-table-body");
        const totalSavingsEl = document.getElementById("total-savings");
        const progressBar = document.getElementById("progress-bar");
        const progressText = document.getElementById("progress-text");
        const submitBtn = document.getElementById("submit-btn");

        const TARGET_GOAL = 500000;
        const SECRET_HASH = ["D", "d", "1", "6", "1", "6"];

        function verifyPin() {
            const input = prompt("الرجاء إدخال الرقم السري:");
            if (!input) return false;
            const chars = input.split("");
            if (chars.length !== SECRET_HASH.length) return false;
            return chars.every((val, index) => val === SECRET_HASH[index]);
        }

        function formatMoney(val) {
            return Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!verifyPin()) {
                alert("الرقم السري غير صحيح!");
                return;
            }

            const type = document.getElementById("action-type").value;
            let amount = parseFloat(document.getElementById("amount").value);
            const note = document.getElementById("note").value;

            // إذا كانت الحركة سحب، نجعل المبلغ بالسالب
            if (type === "withdraw") {
                amount = -Math.abs(amount);
            } else {
                amount = Math.abs(amount);
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الحفظ... ⏳";

            try {
                await addDoc(collection(db, "savings"), {
                    amount: amount,
                    type: type,
                    note: note,
                    createdAt: serverTimestamp(),
                    date: new Date().toLocaleDateString('ar-SA')
                });
                form.reset();
            } catch (error) {
                console.error("خطأ:", error);
                alert("حدث خطأ أثناء الحفظ!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "حفظ في السحابة ☁️";
            }
        });

        // جلب البيانات مرتبة حسب الأحدث لتحسين تجربة الاستجابة
        const q = query(collection(db, "savings"));
        
        onSnapshot(q, (snapshot) => {
            let total = 0;
            tableBody.innerHTML = "";
            
            if(snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400 text-xs">لا توجد مدخرات مسجلة حتى الآن.</td></tr>`;
                totalSavingsEl.textContent = "0.00";
                progressBar.style.width = "0%";
                progressText.textContent = "0% من الهدف";
                return;
            }

            // ترتيب البيانات محلياً للأحدث لضمان عدم تأخر العرض
            const docsList = [];
            snapshot.forEach((docSnap) => {
                docsList.push({ id: docSnap.id, ...docSnap.data() });
            });

            docsList.forEach((data) => {
                const numAmount = Number(data.amount) || 0;
                total += numAmount;

                const isWithdraw = data.type === 'withdraw' || numAmount < 0;
                const badgeClass = isWithdraw ? "bg-rose-50 text-rose-600 border-rose-200" : "bg-emerald-50 text-emerald-600 border-emerald-200";
                const badgeText = isWithdraw ? "سحب 🔻" : "إيداع 🟢";
                const amountClass = isWithdraw ? "text-rose-600" : "text-emerald-600";
                const displayAmount = (isWithdraw ? "- " : "+ ") + formatMoney(Math.abs(numAmount));

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="p-3.5"><span class="text-xs px-2.5 py-1 rounded-full font-bold border ${badgeClass}">${badgeText}</span></td>
                    <td class="p-3.5 font-bold ${amountClass}">${displayAmount} ر.س</td>
                    <td class="p-3.5">${data.note}</td>
                    <td class="p-3.5 text-slate-400 text-xs">${data.date || '-'}</td>
                    <td class="p-3.5 text-center">
                        <button onclick="deleteItem('${data.id}')" class="text-rose-600 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-lg text-xs font-bold transition">حذف</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            totalSavingsEl.textContent = formatMoney(total);
            
            let percentage = (total / TARGET_GOAL) * 100;
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;
            progressBar.style.width = percentage.toFixed(1) + "%";
            progressText.textContent = percentage.toFixed(1) + "% من الهدف";
        }, (error) => {
            console.error("خطأ في الاتصال بقاعدة البيانات:", error);
            tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-rose-500 text-xs">تعذر جلب البيانات، يجدر التحقق من الاتصال.</td></tr>`;
        });

        window.deleteItem = async function(id) {
            if (!verifyPin()) {
                alert("الرقم السري غير صحيح!");
                return;
            }

            if(confirm("هل أنت متأكد من الحذف؟")) {
                try {
                    await deleteDoc(doc(db, "savings", id));
                } catch (error) {
                    console.error("خطأ الحذف:", error);
                }
            }
        };
    </script>
</body>
</html>
